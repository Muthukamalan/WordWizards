services:
  db:
    build: 
      context: src/db
      dockerfile: Dockerfile
    # image: docker.io/library/postgres:17.5-alpine
    container_name: words-db
    restart: unless-stopped
    env_file: src/db/.env
    # environment:
    #   POSTGRES_DB: words_db
    #   POSTGRES_USER: words_app
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U words_app -d words_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - words-network

  api:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: src/api
      dockerfile: Dockerfile
    # image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: words-api
    restart: "unless-stopped"
    env_file: src/api/.env
    ports:
      - "8080:8080"
    networks:
      - words-network

  web:
    build:
      context: src/web
      dockerfile: Dockerfile
    # image: docker.io/golang:alpine
    container_name: words-web
    restart: "unless-stopped"
    depends_on:
      - api
    ports:
      - "8000:8000"
    networks:
      - words-network




volumes:
  postgres_data:

networks:
  words-network:
    driver: bridge
    
